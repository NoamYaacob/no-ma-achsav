name: Update Episodes

on:
  schedule:
    # Run every 4 hours to catch new episodes quickly
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Fetch latest episodes
        run: npm run build

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/episodes.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/episodes.json
          git commit -m "Update episodes data"
          git push
